{% extends "base.html" %}
{% block title %}{{ dataset }} / {{ entity }} — comprehensive results{% endblock %}

{% block headeractions %}
<a class="button" id="to-explanation" href="/result/{{ dataset }}/{{ entity }}">Explanation →</a>
{% endblock %}

{% block content %}
<div id="report-root" data-dataset="{{ dataset }}" data-entity="{{ entity }}">

</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ asset('js/report.js') }}"></script>
{% endblock %}
